name: App tests
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r "Main App/requirements.txt"
      - run: PYTHONPATH="Main App" python -m unittest discover -s "Main App/tests" -v
