name: App tests
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r "gym_app/requirements.txt"
      - run: PYTHONPATH="gym_app" python -m unittest discover -s "gym_app/tests" -v
